<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title"><title id="title">두 화살표의 텐서곱을 1개 3개 5개 성분으로 나누기</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#617b8a"/></marker></defs><rect width="1000" height="580" fill="white"/><rect x="65" y="25" width="360" height="100" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="245.0" y="58" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">화살표 a · 1o</text><text x="245.0" y="89" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">(aₓ, aᵧ, a_z) · 3개 성분</text><rect x="575" y="25" width="360" height="100" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="755.0" y="58" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">화살표 b · 1o</text><text x="755.0" y="89" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">(bₓ, bᵧ, b_z) · 3개 성분</text><rect x="300" y="180" width="400" height="130" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="500.0" y="213" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">먼저 모든 성분을 조합</text><text x="500.0" y="244" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">Aαβ = aα bβ</text><text x="500.0" y="272" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">3 × 3 = 9개 · outer product</text><path d="M245,125 L245,150 L400,150 L400,180" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M755,125 L755,150 L600,150 L600,180" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><rect x="25" y="390" width="280" height="130" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="165.0" y="423" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">0e · 1개</text><text x="165.0" y="454" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">trace에 해당하는 정보</text><text x="165.0" y="482" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">내적 a·b와 연결</text><rect x="360" y="390" width="280" height="130" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="500.0" y="423" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">1e · 3개</text><text x="500.0" y="454" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">반대칭 부분의 정보</text><text x="500.0" y="482" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">외적 a×b와 연결</text><rect x="695" y="390" width="280" height="130" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="835.0" y="423" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">2e · 5개</text><text x="835.0" y="454" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">대칭 무추적 부분</text><text x="835.0" y="482" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">방향에 따른 비등방 정보</text><path d="M500,310 L500,350 L165,350 L165,390" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M500,310 L500,350 L500,350 L500,390" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M500,310 L500,350 L835,350 L835,390" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="563" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">e3nn은 고정된 CG 규칙으로 성분을 나눕니다. 학습은 허용된 조합의 가중치를 조정합니다.</text></svg>