<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img" aria-labelledby="title"><title id="title">합쳐진 이웃 특징을 곱하면 이웃 사이 교차항도 만들어진다</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#617b8a"/></marker></defs><rect width="1000" height="505" fill="white"/><rect x="40" y="20" width="300" height="110" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="190.0" y="53" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">두 이웃 메시지</text><text x="190.0" y="84" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">m1, m2</text><rect x="380" y="20" width="240" height="110" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="500.0" y="53" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">먼저 합산</text><text x="500.0" y="84" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">A = m1 + m2</text><rect x="660" y="20" width="300" height="110" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="810.0" y="53" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">그다음 TP(A,A)</text><text x="810.0" y="84" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">출력은 다시 [N,51]</text><path d="M340,75 L380,75" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M620,75 L660,75" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="205" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#234253">TP가 고정된 가중치에서 두 입력에 대해 쌍선형이므로</text><text x="500" y="247" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#234253">TP(m1+m2, m1+m2)에는 다음 네 항이 들어갑니다.</text><rect x="20" y="300" width="225" height="100" rx="10" fill="#f5f6f8" stroke="#9caab6" stroke-width="1.7"/><text x="132.5" y="333" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">TP(m1, m1)</text><text x="132.5" y="364" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">첫 이웃끼리</text><rect x="265" y="300" width="225" height="100" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="377.5" y="333" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">TP(m1, m2)</text><text x="377.5" y="364" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">서로 다른 이웃</text><rect x="510" y="300" width="225" height="100" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="622.5" y="333" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">TP(m2, m1)</text><text x="622.5" y="364" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">서로 다른 이웃</text><rect x="755" y="300" width="225" height="100" rx="10" fill="#f5f6f8" stroke="#9caab6" stroke-width="1.7"/><text x="867.5" y="333" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">TP(m2, m2)</text><text x="867.5" y="364" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">둘째 이웃끼리</text><text x="500" y="447" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#234253">실제 A는 많은 irrep와 여러 채널을 담습니다. 단일 화살표 a의 a×a=0과 구분해야 합니다.</text><text x="500" y="478" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#234253">도식에서는 정규화 계수를 생략했습니다. correlation=3이면 TP(TP(A,A),A)를 더합니다.</text></svg>