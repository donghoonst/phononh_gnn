<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title"><title id="title">Interaction 안에서 메시지가 세 경로로 사용되는 과정</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#617b8a"/></marker></defs><rect width="1000" height="800" fill="white"/><rect x="330" y="20" width="340" height="105" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="500.0" y="53" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">RadialTP 메시지</text><text x="500.0" y="84" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">h_j + 방향 + 거리 → m_ij [E,51]</text><rect x="35" y="200" width="300" height="110" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="185.0" y="233" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">density 합산</text><text x="185.0" y="264" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">A_i = Σ_j m_ij / √12</text><text x="185.0" y="292" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[N,51]</text><rect x="665" y="200" width="300" height="155" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="815.0" y="233" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">local attention</text><text x="815.0" y="264" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">score: h_i의 0e + h_j의 0e + b</text><text x="815.0" y="292" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">원자별 softmax(score + log f_c)</text><text x="815.0" y="320" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">value는 Linear(m_ij)</text><path d="M400,125 L400,160 L185,160 L185,200" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M600,125 L600,160 L815,160 L815,200" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><rect x="35" y="410" width="280" height="100" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="175.0" y="443" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">sum 경로</text><text x="175.0" y="474" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">Linear(A_i) → [N,51]</text><rect x="360" y="410" width="280" height="100" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="500.0" y="443" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">correlation 경로</text><text x="500.0" y="474" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">TP(A_i, A_i) → [N,51]</text><rect x="685" y="410" width="280" height="100" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="825.0" y="443" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">attention 경로</text><text x="825.0" y="474" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">2개 head 연결 → Linear</text><text x="825.0" y="502" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[N,102] → [N,51]</text><path d="M150,310 L150,410" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M250,310 L250,355 L500,355 L500,410" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M815,355 L815,410" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><rect x="330" y="585" width="340" height="135" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="500.0" y="618" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">세 경로를 더하고 Gate</text><text x="500.0" y="649" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">U = sum + correlation + attention</text><text x="500.0" y="677" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">h_new = h_old + Gate(U) / √2</text><path d="M175,510 L175,650 L330,650" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M500,510 L500,585" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M825,510 L825,650 L670,650" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="770" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#234253">그림은 correlation=2, attention=True, aggregation=sum_attention, layers=2 기준입니다.</text></svg>