ight="700" fill="#234253">readout + reconstruct</text><text x="825.0" y="614" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[M,51] → [M,9] → [M,3,3]</text><rect x="355" y="550" width="290" height="105" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="500.0" y="583" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">IFCModel의 제약</text><text x="500.0" y="614" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">교환 대칭 → 합산 → 투영</text><rect x="30" y="550" width="290" height="105" rx="10" fill="#f5f6f8" stroke="#9caab6" stroke-width="1.7"/><text x="175.0" y="583" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">모델 밖의 물리 계산</text><text x="175.0" y="614" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">onsite → D(q) → 주파수</text><path d="M825,490 L825,550" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M680,602 L645,602" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M355,602 L320,602" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="700" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">h는 원자별 메모, p는 출력 이미지별 메모입니다. p를 h로 되돌리는 경로는 없습니다.</text></svg>