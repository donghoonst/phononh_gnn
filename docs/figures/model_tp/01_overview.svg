ill="#234253">Interaction 1 → h1</text><text x="500.0" y="244" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">메시지 + 집계 + Gate</text><rect x="680" y="180" width="290" height="105" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="825.0" y="213" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">Interaction 2 → h2</text><text x="825.0" y="244" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">메시지 + 집계 + Gate</text><path d="M165,120 L165,180" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M320,232 L355,232" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M645,232 L680,232" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="355" width="290" height="135" rx="10" fill="#f0edf7" stroke="#9883b4" stroke-width="1.7"/><text x="175.0" y="388" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">pair_init → p0</text><text x="175.0" y="419" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">h0의 양 끝점 + pair 방향</text><text x="175.0" y="447" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">RadialTP → [M,51]</text><rect x="355" y="355" width="290" height="135" rx="10" fill="#f0edf7" stroke="#9883b4" stroke-width="1.7"/><text x="500.0" y="388" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">Pair update 1 → p1</text><text x="500.0" y="419" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">새 h1 + 