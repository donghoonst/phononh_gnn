<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title"><title id="title">거리 MLP가 Tensor Product의 가중치를 만드는 RadialTP</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#617b8a"/></marker></defs><rect width="1000" height="640" fill="white"/><rect x="25" y="20" width="280" height="110" rx="10" fill="#f5f6f8" stroke="#9caab6" stroke-width="1.7"/><text x="165.0" y="53" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">거리 특징 b(r)</text><text x="165.0" y="84" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[E,8]</text><text x="165.0" y="112" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">geometry가 만든 8개 숫자</text><rect x="360" y="20" width="280" height="110" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="500.0" y="53" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">공유하는 거리 MLP</text><text x="500.0" y="84" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">Linear → SiLU → Linear</text><text x="500.0" y="112" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">8 → 6 → 225</text><rect x="695" y="20" width="280" height="110" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="835.0" y="53" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">엣지별 가중치 W(r)</text><text x="835.0" y="84" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[E,225]</text><text x="835.0" y="112" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">엣지마다 계산된 혼합 비율</text><path d="M305,75 L360,75" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M640,75 L695,75" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><rect x="25" y="245" width="280" height="105" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="165.0" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">이웃 특징 h_j</text><text x="165.0" y="309" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[E,51]</text><rect x="360" y="245" width="280" height="105" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="500.0" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">Tensor Product</text><text x="500.0" y="309" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">TP(h_j, Y; W) → [E,51]</text><rect x="695" y="245" width="280" height="105" rx="10" fill="#f5f6f8" stroke="#9caab6" stroke-width="1.7"/><text x="835.0" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">방향 특징 Y</text><text x="835.0" y="309" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[E,9] · l = 0, 1, 2</text><path d="M305,297 L360,297" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M695,297 L640,297" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M835,130 L835,180 L500,180 L500,245" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="650" y="169" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="17" font-weight="400" fill="#526b79">혼합 비율을 전달</text><rect x="360" y="430" width="280" height="100" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="500.0" y="463" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">cutoff envelope 곱하기</text><text x="500.0" y="494" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">메시지 m_ij [E,51]</text><rect x="695" y="430" width="280" height="100" rx="10" fill="#f5f6f8" stroke="#9caab6" stroke-width="1.7"/><text x="835.0" y="463" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">envelope f_c(r)</text><text x="835.0" y="494" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[E] · 거리 경계에서 0</text><path d="M500,350 L500,430" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M695,480 L640,480" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="580" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#234253">225는 이 설정의 message TP 값입니다. pair용 RadialTP는 입력이 102차원이라 450개입니다.</text><text x="500" y="611" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#234253">MLP의 파라미터는 모든 엣지가 공유합니다. 엣지마다 따로 학습하는 225개 표가 아닙니다.</text></svg>