<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title"><title id="title">방향을 보존하며 irrep 한 묶음의 크기를 조절하는 Gate</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#617b8a"/></marker></defs><rect width="1000" height="455" fill="white"/><rect x="25" y="25" width="280" height="105" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="165.0" y="58" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">입력 묶음의 0e 3개</text><text x="165.0" y="89" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">[*,3] · 회전 불변 숫자</text><rect x="360" y="25" width="280" height="105" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="500.0" y="58" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">Linear + sigmoid</text><text x="500.0" y="89" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">3 → 12 · 0과 1 사이</text><rect x="695" y="25" width="280" height="105" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="835.0" y="58" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">게이트 12개</text><text x="835.0" y="89" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">비-스칼라 irrep 복사본마다 1개</text><path d="M305,77 L360,77" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M640,77 L695,77" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><rect x="25" y="245" width="280" height="100" rx="10" fill="#eaf3f7" stroke="#6c94a6" stroke-width="1.7"/><text x="165.0" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">벡터 복사본 하나</text><text x="165.0" y="309" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">v = (2, -1, 3)</text><rect x="360" y="245" width="280" height="100" rx="10" fill="#e5f3ef" stroke="#4e9585" stroke-width="1.7"/><text x="500.0" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">세 성분에 같은 수 곱하기</text><text x="500.0" y="309" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">예: g = 0.7</text><rect x="695" y="245" width="280" height="100" rx="10" fill="#fff2df" stroke="#c09a54" stroke-width="1.7"/><text x="835.0" y="278" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#234253">방향을 유지한 결과</text><text x="835.0" y="309" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#234253">g v = (1.4, -0.7, 2.1)</text><path d="M305,295 L360,295" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M640,295 L695,295" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><path d="M835,130 L835,185 L500,185 L500,245" fill="none" stroke="#617b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="500" y="403" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#234253">2차 irrep의 5개 성분에도 한 게이트를 함께 곱합니다. 0e 성분 자체에는 SiLU를 적용합니다.</text><text x="500" y="435" text-anchor="middle" font-family="Noto Sans CJK KR, Noto Sans, sans-serif" font-size="18" font-weight="400" fill="#234253">*는 원자 개수 N 또는 이미지 개수 M입니다. 게이트는 들어온 특징에서 매번 계산됩니다.</text></svg>