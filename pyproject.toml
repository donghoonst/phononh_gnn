[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc2-pair-gnn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "e3nn>=0.5", "numpy", "ase", "phonopy>=2.30", "matplotlib", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]
notebook = ["jupyterlab>=4", "nbformat>=5", "nbclient>=0.10", "black>=24"]

[project.scripts]
ifc2 = "ifc2.cli:main"

[tool.setuptools.packages.find]
include = ["ifc2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
